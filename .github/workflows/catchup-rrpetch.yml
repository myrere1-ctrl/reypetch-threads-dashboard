name: Catchup Post - rrpetch

on:
  workflow_dispatch:

concurrency:
  group: catchup-rrpetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  catchup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull latest log
        run: git pull --rebase

      - name: Catchup post if needed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.RRPETCH_THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.RRPETCH_THREADS_USER_ID }}
        run: node scripts/catchup-post.mjs --account=rrpetch

      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rrpetch/posted-log.json
          if git diff --staged --quiet; then
            echo "No new posts"
          else
            git commit -m "log(rrpetch): catchup post"
            git pull --rebase
            git push
          fi
